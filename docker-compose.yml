version: '3.8'

services:
  insider-detector:
    build: .
    container_name: polymarket-insider
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./google-oauth-creds.json:/app/google-oauth-creds.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # IBKR Gateway via ibg-controller — execution infra, NOT auto-started.
  # Start: docker compose --profile ibkr up -d ib-gateway
  # Bot-user botuser-jorisfalter (no withdrawal/transfer rights) uses TOTP 2FA;
  # IBKR_TOTP_SECRET (base32) lets the controller log in AND redo the weekly
  # re-auth unattended (no phone tap). Trade-off accepted 2026-10-05: both
  # factors live in the VPS .env; blast radius = mis-invested funds, never
  # withdrawn. Health: http://ib-gateway:8080/health (200 = logged in).
  ib-gateway:
    image: ghcr.io/code-hustler-ft3d/ibg-controller:latest
    container_name: ib-gateway
    restart: unless-stopped
    profiles: ["ibkr"]
    stop_grace_period: 90s
    environment:
      USE_IBG_CONTROLLER: "yes"
      TRADING_MODE: live
      TWS_USERID: ${IBKR_USERNAME}
      TWS_PASSWORD: ${IBKR_PASSWORD}
      TWOFACTOR_CODE: ${IBKR_TOTP_SECRET}
      READ_ONLY_API: "no"
      AUTO_RESTART_TIME: "11:59 PM"
    ports:
      - "127.0.0.1:4001:4003"   # live API (socat-forwarded)
